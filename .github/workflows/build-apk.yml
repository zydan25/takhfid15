name: Build Android APK

on:
  push:
    branches:
      - "main"
      - "master"
      - "fix/takhfid15-runtime-and-admin-2026-09-19"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Prepare Capacitor Web Assets
        run: |
          rm -rf www
          mkdir -p www
          cp -R dist/. www/

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Restore Capacitor Android Gradle Files
        run: |
          if [ ! -f android/gradlew ]; then
            echo "Tracked Android project is missing Gradle wrapper/root files; generating them from Capacitor."
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.altakhfeedalsh.app",
            "appName": "التخفيض الصح",
            "webDir": "www"
          }
          EOF

            mv android android-existing
            npx cap add android

            cp android/gradlew android-existing/gradlew
            cp android/gradlew.bat android-existing/gradlew.bat
            cp android/build.gradle android-existing/build.gradle
            cp android/settings.gradle android-existing/settings.gradle
            cp android/variables.gradle android-existing/variables.gradle
            cp android/gradle.properties android-existing/gradle.properties
            cp -R android/gradle android-existing/gradle

            if [ -d android/capacitor-cordova-android-plugins ]; then
              rm -rf android-existing/capacitor-cordova-android-plugins
              cp -R android/capacitor-cordova-android-plugins android-existing/capacitor-cordova-android-plugins
            fi

            # The tracked Android shell is intentionally minimal and may not contain
            # Capacitor's generated Android resources or launcher activity. Keep the
            # tracked native code/settings while restoring the generated pieces needed
            # by a clean CI build and by Android at runtime.
            rm -rf android-existing/app/src/main/res
            cp -R android/app/src/main/res android-existing/app/src/main/res

            if [ -d android/app/src/main/java ]; then
              mkdir -p android-existing/app/src/main/java
              cp -R android/app/src/main/java/. android-existing/app/src/main/java/
            fi

            if [ -d android/app/src/main/kotlin ]; then
              mkdir -p android-existing/app/src/main/kotlin
              cp -R android/app/src/main/kotlin/. android-existing/app/src/main/kotlin/
            fi

            rm -rf android
            mv android-existing android
            rm -f capacitor.config.json
          fi

      - name: Verify fresh Vite build
        run: |
          test -f dist/index.html
          test -s dist/index.html
          js_count=$(find dist/assets -maxdepth 1 -type f -name "*.js" -size +0c | wc -l)
          if [ "$js_count" -lt 1 ]; then
            echo "No non-empty JavaScript bundle was produced by Vite."
            find dist -maxdepth 3 -type f -print
            exit 1
          fi
          if grep -q 'index-Co2L1R-b.js' dist/index.html; then
            echo "Unexpected stale hard-coded bundle reference detected."
            cat dist/index.html
            exit 1
          fi

      - name: Sync Web Assets to Android Native Project
        run: |
          # Remove stale tracked bundles so an old native asset cannot be loaded.
          rm -rf android/app/src/main/assets/public/assets
          npx cap sync android

      - name: Make Gradlew Executable
        working-directory: android
        run: |
          chmod +x ./gradlew

      - name: Build Android Debug APK with Gradle
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Altakhfeed-AlSah-Store.apk
          echo "APK generated successfully at output-apk/Altakhfeed-AlSah-Store.apk"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Altakhfeed-AlSah-Android-APK
          path: output-apk/Altakhfeed-AlSah-Store.apk
          retention-days: 30
