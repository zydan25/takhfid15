name: Build Takhfid Flutter Client

on:
  workflow_dispatch:
  push:
    branches:
      - new
  pull_request:
    branches:
      - new

concurrency:
  group: takhfid-flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Enable Android internet access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              anchor = '<application'
              text = text.replace(anchor, f"    {permission}\\n\\n    {anchor}", 1)
              path.write_text(text)
          PY
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

      - name: Resolve packages
        run: flutter pub get

      - name: Generate launcher icon
        timeout-minutes: 3
        run: dart run flutter_launcher_icons

      - name: Format Dart sources
        run: dart format lib

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: takhfid-client-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish AAB
        uses: actions/upload-artifact@v4
        with:
          name: takhfid-client-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Generate web platform files
        run: flutter create --platforms=web .

      - name: Resolve packages
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/takhfid15/"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
