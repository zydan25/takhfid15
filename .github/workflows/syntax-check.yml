name: Takhfid Shipped JS Syntax Check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check shipped JavaScript syntax
        run: |
          node --input-type=module --check < public/assets/index-Co2L1R-b.js
          node --input-type=module --check < public/assets/takhfid-bridge.js
