name: Temporary Server API Diagnostic

on:
  push:
    branches: ["feat/server-authoritative-admin-2026-09"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check API endpoints
        shell: bash
        run: |
          set +e
          for endpoint in             "https://whats.alattab.site/takhfid/api/v4/content"             "https://whats.alattab.site/takhfid/api/v4/products"; do
            echo "===== $endpoint ====="
            curl -4 -sS -L --connect-timeout 10 --max-time 40               -o /tmp/api.out               -w "HTTP=%{http_code} DNS=%{time_namelookup}s CONNECT=%{time_connect}s TTFB=%{time_starttransfer}s TOTAL=%{time_total}s SIZE=%{size_download}\n"               "$endpoint"
            rc=$?
            echo "curl_exit=$rc"
            if [ -f /tmp/api.out ]; then
              head -c 1000 /tmp/api.out
              echo
            fi
          done
