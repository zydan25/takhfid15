name: takhfid_client
description: تطبيق العميل Flutter للتخفيض الصح
publish_to: none
version: 1.0.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter_skill: ^0.2.6
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.0
  cached_network_image: ^3.3.1
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  video_player: ^2.9.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#08080A"
  adaptive_icon_foreground: "assets/icon.png"
