name: takhfid_client
description: تطبيق العميل Flutter للتخفيض الصح
publish_to: none
version: 1.0.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  image: ^4.10.1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/icon.png
  min_sdk_android: 24
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/icon.png
