<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="التخفيض الصح" />
    <meta name="application-name" content="التخفيض الصح" />
    <title>التخفيض الصح | Yemen Code للتقنيات الذكية</title>
    <meta name="description" content="التخفيض الصح — متجر التخفيضات." />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased selection:bg-rose-500 selection:text-white font-['Cairo',sans-serif]">
    <div id="root"></div>

    <script>
      window.VITE_API_BASE_URL = "%VITE_API_BASE_URL%";
      window.TAKHFID_RUNTIME_CONFIG = {
        apiBaseUrl: "%VITE_API_BASE_URL%",
        apiTimeoutMs: Number("%VITE_API_TIMEOUT_MS%" || 20000),
        apiRetryCount: Number("%VITE_API_RETRY_COUNT%" || 1),
        serverAuthoritative: "%VITE_SERVER_AUTHORITATIVE%" !== "false",
        uploadMaxMb: Number("%VITE_UPLOAD_MAX_MB%" || 25)
      };

      (function () {
        var appMounted = false;

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function showBootError(error, source) {
          if (appMounted) return;
          var root = document.getElementById("root");
          if (!root) return;

          var message;
          try {
            message = error && (error.stack || error.message)
              ? (error.stack || error.message)
              : String(error || "خطأ غير معروف");
          } catch (_) {
            message = "خطأ غير معروف";
          }

          root.innerHTML =
            '<div dir="rtl" style="min-height:100vh;background:#0b0f19;color:#fff;padding:24px;font-family:Cairo,Tajawal,sans-serif;display:flex;align-items:center;justify-content:center;box-sizing:border-box;">' +
              '<div style="width:100%;max-width:720px;background:#111827;border:1px solid #374151;border-radius:18px;padding:22px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.35);">' +
                '<div style="font-size:19px;font-weight:800;margin-bottom:8px;">تعذر تشغيل التطبيق</div>' +
                '<div style="font-size:13px;color:#cbd5e1;margin-bottom:14px;">حدث خطأ أثناء تحميل التطبيق. تم عرض التفاصيل بدل الشاشة البيضاء.</div>' +
                '<pre style="font:11px/1.5 monospace;color:#fca5a5;background:#1f2937;border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left;max-height:320px;overflow:auto;">' +
                  escapeHtml(source || "runtime") + ": " + escapeHtml(message) +
                '</pre>' +
                '<button onclick="location.reload()" style="margin-top:14px;background:#e7193f;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:800;font-size:13px;">إعادة تشغيل التطبيق</button>' +
              '</div>' +
            '</div>';
        }

        window.__takhfidShowBootError = showBootError;
        window.addEventListener("error", function (event) {
          if (!appMounted && event && (event.error || event.message)) {
            console.error("[Takhfid boot/runtime error]", event.error || event.message);
            showBootError(event.error || event.message, "window.error");
          }
        });
        window.addEventListener("unhandledrejection", function (event) {
          if (!appMounted) {
            console.error("[Takhfid boot unhandled rejection]", event.reason);
            showBootError(event.reason, "unhandledrejection");
          }
        });

        var markMountedTimer = window.setInterval(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount > 0 && !document.getElementById("takhfid-boot-error")) {
            appMounted = true;
            window.clearInterval(markMountedTimer);
          }
        }, 50);

        var isNative =
          !!window.Capacitor ||
          /Android|wv|Capacitor/i.test((navigator && navigator.userAgent) || "") ||
          (window.location && window.location.hostname === "localhost");

        window.__takhfidHandleNativeBack = function () {
          try {
            var visible = function (el) {
              if (!el) return false;
              var cs = window.getComputedStyle(el);
              if (cs.display === "none" || cs.visibility === "hidden" || Number(cs.opacity) === 0) return false;
              return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
            };
            var clickSelector = function (selector) {
              var nodes = document.querySelectorAll(selector);
              for (var i = nodes.length - 1; i >= 0; i--) {
                if (visible(nodes[i])) {
                  nodes[i].click();
                  return true;
                }
              }
              return false;
            };

            if (clickSelector("#product-editor-close")) return true;
            if (clickSelector("#campaign-close-btn")) return true;

            var overlays = document.querySelectorAll(".fixed.inset-0");
            for (var oi = overlays.length - 1; oi >= 0; oi--) {
              var overlay = overlays[oi];
              if (!visible(overlay)) continue;
              var button = overlay.querySelector('button[aria-label="رجوع"],button[aria-label="إغلاق"],button[title="إغلاق"]');
              if (visible(button)) {
                button.click();
                return true;
              }
            }

            if (clickSelector("#admin-back-btn")) return true;

            if (
              window.__takhfidScreen &&
              window.__takhfidScreen !== "home" &&
              typeof window.__takhfidNavigateHome === "function"
            ) {
              window.__takhfidNavigateHome();
              return true;
            }

            return false;
          } catch (error) {
            console.warn("[Takhfid] native back handler failed:", error);
            return false;
          }
        };

        if (isNative && "serviceWorker" in navigator) {
          try {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              return Promise.all(registrations.map(function (registration) {
                return registration.unregister();
              }));
            }).catch(function (error) {
              console.warn("[Takhfid] Unable to clear old service workers:", error);
            });
            navigator.serviceWorker.register = function () {
              return Promise.reject(new Error("Service Worker disabled inside native Capacitor app"));
            };
          } catch (error) {
            console.warn("[Takhfid] Native service worker guard failed:", error);
          }
        }
      })();
    </script>

    <script src="/assets/takhfid-bridge.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
